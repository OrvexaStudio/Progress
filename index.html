<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-mark">P</div>
                <span>Progress</span>
            </div>

            <nav class="main-nav">

                <button class="nav-item active" data-page="dashboard">
                    <span>⌂</span>
                    Dashboard
                </button>

                <button class="nav-item" data-page="goals">
                    <span>◎</span>
                    Obiettivi
                </button>

                <button class="nav-item" data-page="savings">
                    <span>€</span>
                    Risparmi
                </button>

                <button class="nav-item" data-page="activity">
                    <span>↗</span>
                    Attività
                </button>

            </nav>

            <div class="sidebar-bottom">

                <button class="nav-item" data-page="settings">
                    <span>⚙</span>
                    Impostazioni
                </button>

            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <header class="topbar">

                <div>
                    <p class="eyebrow">IL TUO SPAZIO</p>
                    <h1 id="page-title">Dashboard</h1>
                </div>

                <div class="profile">
                    <div class="avatar">F</div>
                    <div>
                        <strong>Francesco</strong>
                        <span>Il tuo progresso</span>
                    </div>
                </div>

            </header>


            <!-- PAGE CONTAINER -->
            <section id="app-content"></section>

        </main>

    </div>


<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/navigation.js"></script>
<script src="js/dashboard.js"></script>

<script src="js/goals/goal-progress.js"></script>
<script src="js/goals/goal-details.js"></script>
<script src="js/goals/goals.js"></script>
<script src="js/savings/savings-calculator.js"></script>
<script src="js/savings/savings-plan.js"></script>
<script src="js/savings/savings.js"></script>
<script src="js/activity/activity-stats.js"></script>
<script src="js/activity/activity-form.js"></script>
<script src="js/activity/activity.js"></script>

<script src="js/settings/settings-data.js"></script>
<script src="js/settings/settings-profile.js"></script>
<script src="js/settings/settings.js"></script>

<script src="js/app.js"></script>

    <button
    id="mobile-sidebar-toggle"
    class="mobile-sidebar-toggle"
    aria-label="Apri menu"
    aria-expanded="false"
>
    <span class="toggle-line line-1"></span>
    <span class="toggle-line line-2"></span>
</button>

<div
    id="mobile-sidebar-overlay"
    class="mobile-sidebar-overlay"
></div>

</body>
</html>
